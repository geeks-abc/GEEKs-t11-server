services:
  mysql:
    image: mysql:8.0
    container_name: geeks-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: geeks
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - geeks-mysql-data:/var/lib/mysql

volumes:
  geeks-mysql-data:
