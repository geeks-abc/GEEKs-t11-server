services:
  mysql:
    image: mysql:8.0
    container_name: geeks-mysql
    restart: unless-stopped
    ports:
      # 로컬호스트에만 바인딩 — 외부(LAN/인터넷)에서 접근 불가하게 차단
      - '127.0.0.1:3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: geeks-local-dev
      MYSQL_DATABASE: geeks
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - geeks-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-uroot', '-pgeeks-local-dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geeks-mysql-data:
